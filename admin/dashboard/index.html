<!DOCTYPE html>
<html lang="ko">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>대시보드</title>

    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/layout.css">

</head>

<body>

<div class="layout">

    <!-- 사이드바 -->
    <aside class="sidebar">

        <div class="sidebar-header">

            해운대구

        </div>

        <nav class="sidebar-menu">

            <a href="../dashboard/index.html" class="active">
                📊&nbsp;&nbsp;대시보드
            </a>

            <a href="../grandparents/index.html">
                👴&nbsp;&nbsp;조부모 관리
            </a>

            <a href="../grandchildren/index.html">
                👶&nbsp;&nbsp;손주 관리
            </a>

            <a href="../activities/index.html">
                📝&nbsp;&nbsp;활동 관리
            </a>

            <a href="../payments/index.html">
                💰&nbsp;&nbsp;지급 관리
            </a>

            <a href="../notices/index.html">
                📢&nbsp;&nbsp;공지사항
            </a>

            <a href="../settings/index.html">
                ⚙️&nbsp;&nbsp;환경설정
            </a>

        </nav>

    </aside>

    <!-- 메인 -->

    <main class="main">

        <header class="header">

            <div class="header-title">

                조부모 손주돌봄수당 관리시스템

            </div>

            <div class="header-right">

                <span id="loginUser">

                    김장훈

                </span>

                <button id="logoutBtn">

                    로그아웃

                </button>

            </div>

        </header>

       <section class="content">

    <div class="dashboard-grid">

        <div class="dashboard-card">

            <h3>등록 조부모</h3>

            <div class="dashboard-number">

                <span id="cardGrandparents">

                    0명

                </span>

            </div>

        </div>

        <div class="dashboard-card">

            <h3>등록 손주</h3>

            <div class="dashboard-number">

                <span id="cardGrandchildren">

                    0명

                </span>

            </div>

        </div>

        <div class="dashboard-card">

            <h3>오늘 활동</h3>

            <div class="dashboard-number">

                <span id="cardTodayActivity">

                    0건

                </span>

            </div>

        </div>

        <div class="dashboard-card">

            <h3>이번달 활동</h3>

            <div class="dashboard-number">

                <span id="cardMonthActivity">

                    0건

                </span>

            </div>

        </div>

    </div>

        <div class="dashboard-row">

        <!-- 총 활동시간 -->

        <div class="page-card">

            <h3 class="section-title">

                총 활동시간

            </h3>

            <div
                id="totalDuration"
                class="dashboard-big-number">

                0시간

            </div>

        </div>

        <!-- 오늘 체크인 -->

        <div class="page-card">

            <h3 class="section-title">

                오늘 체크인 중

            </h3>

            <div
                id="todayCheckinList">

                <div class="empty-row">

                    현재 체크인 중인 활동이 없습니다.

                </div>

            </div>

        </div>

    </div>

    <div class="page-card">

        <h3 class="section-title">

            최근 활동

        </h3>

        <table class="dashboard-table">

            <thead>

                <tr>

                    <th>날짜</th>

                    <th>조부모</th>

                    <th>손주</th>

                    <th>시작</th>

                    <th>종료</th>

                    <th>시간</th>

                </tr>

            </thead>

            <tbody id="recentActivityTable">

                <tr>

                    <td colspan="6" class="empty-row">

                        불러오는 중...

                    </td>

                </tr>

            </tbody>

        </table>

    </div>

    </section>

    </main>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="../../shared/supabase.js"></script>

<script src="./dashboard.js"></script>

</body>

</html>
